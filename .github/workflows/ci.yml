name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (API + engine)
        run: npm run lint

      - name: Typecheck API
        run: npm run typecheck

      - name: Engine unit tests
        run: npm test

      - name: API tests
        run: npm run test:api

      - name: Build web (typecheck + bundle)
        run: npm run build

      - name: Production dependency audit (high and critical only)
        run: npm audit --omit=dev --audit-level=high
